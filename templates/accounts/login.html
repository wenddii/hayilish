{% extends "base.html" %}

{% block title %}Login - Hayilish Color Bar{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
  <div class="card">
    <div class="card-header" style="text-align: center; display: block; border-bottom: none; margin-bottom: 0.5rem;">
      <h2 class="card-title" style="font-size: 1.4rem;">Salon Sign In</h2>
      <p class="card-subtitle" style="margin-top: 0.25rem;">Sign in to access tickets and services</p>
    </div>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>

      <div class="form-group">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem;">Sign In</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
